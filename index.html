<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Steinweg Machineplatform (demo)</title>
<style>
:root{
  --navy:#1F3864; --blue:#0070C0; --blue-2:#2E74B5; --tint:#DEEAF6; --bg:#F4F6F9; --card:#FFFFFF;
  --line:#D9DEE5; --text:#1A1A1A; --muted:#5F6B7A; --ok:#2E7D32; --ok-bg:#E6F4EA; --warn:#B26A00; --warn-bg:#FFF4E0;
  --err:#C62828; --err-bg:#FDECEA; --grey-bg:#EEF0F3;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit}
a{color:var(--blue)}
.demo-bar{background:#FFF8D6;border-bottom:1px solid #E8D98A;padding:6px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
.demo-bar b{color:#6B5800}
.demo-bar select{width:auto;padding:3px 6px;border:1px solid #C9B65A;border-radius:4px;background:#fff}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:0 16px;height:52px}
.top .brand{font-weight:bold;font-size:16px;letter-spacing:.2px}
.top .brand span{font-weight:normal;opacity:.75;font-size:13px;margin-left:8px}
.top .spacer{flex:1}
.top .user{font-size:13px;text-align:right;line-height:1.25}
.top .user small{opacity:.75}
.wrap{display:flex;min-height:calc(100vh - 86px)}
nav{width:220px;background:#fff;border-right:1px solid var(--line);padding:12px 0;flex-shrink:0}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 18px;cursor:pointer;color:var(--text)}
nav button:hover{background:var(--grey-bg)}
nav button.active{background:var(--tint);color:var(--navy);font-weight:bold;border-left:3px solid var(--blue);padding-left:15px}
nav .sec{font-size:11px;text-transform:uppercase;color:var(--muted);padding:14px 18px 4px;letter-spacing:.5px}
main{flex:1;padding:22px 26px;max-width:1200px}
h1{font-size:21px;margin:0 0 4px;color:var(--navy)}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px;color:var(--navy)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi .v{font-size:26px;font-weight:bold;color:var(--navy)}
.kpi .l{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse}
th{background:var(--navy);color:#fff;text-align:left;font-weight:bold;padding:8px 10px;font-size:13px}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:#F7FAFD}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:bold;white-space:nowrap}
.b-concept{background:var(--grey-bg);color:#444}
.b-verstuurd{background:var(--tint);color:var(--navy)}
.b-ontvangen{background:var(--warn-bg);color:var(--warn)}
.b-actief{background:#E3F2FD;color:#0D47A1}
.b-gereed{background:var(--ok-bg);color:var(--ok)}
.b-afgekeurd{background:var(--err-bg);color:var(--err)}
.b-geannuleerd{background:var(--grey-bg);color:#777}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.dot.on{background:#2E7D32}.dot.off{background:#9AA3AE}.dot.warn{background:#E0A100}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:bold}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #C5CCD6;border-radius:5px;background:#fff}
input[readonly]{background:#F1F3F6;color:#333}
input:focus,select:focus,textarea:focus{outline:2px solid var(--tint);border-color:var(--blue)}
.field{margin-bottom:12px}
.err{color:var(--err);font-size:12px;margin-top:4px}
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;padding:8px 16px;border-radius:5px;cursor:pointer;font-weight:bold}
.btn:hover{filter:brightness(.95)}
.btn.sec{background:#fff;color:var(--blue)}
.btn.danger{background:#fff;color:var(--err);border-color:var(--err)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.note{background:var(--tint);border-left:3px solid var(--blue);padding:10px 12px;border-radius:0 5px 5px 0;font-size:13px;margin-bottom:14px}
.locked{background:var(--grey-bg);border:1px dashed #B8C0CB;padding:28px;text-align:center;color:var(--muted);border-radius:8px}
pre.csv{background:#F4F5F7;border:1px solid var(--line);padding:10px;border-radius:5px;font-size:11.5px;overflow:auto;white-space:pre;margin:0}
.sticker{border:2px solid #222;border-radius:4px;padding:10px 12px;font-family:"Courier New",monospace;font-size:13px;background:#fff;width:260px;line-height:1.5}
.dot.err{background:var(--err)}
.b-storing{background:var(--err-bg);color:var(--err)}
.b-waarschuwing{background:var(--warn-bg);color:var(--warn)}
tr.resolved td{color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 16px}
.tabs button{border:0;background:none;padding:9px 16px;cursor:pointer;color:var(--muted);font-weight:bold;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--navy);border-bottom-color:var(--blue)}
.tabs button:hover{color:var(--navy)}
.bar-row{display:flex;align-items:center;gap:10px;margin:7px 0}
.bar-l{width:92px;font-size:13px}
.bar-t{flex:1;height:12px;background:var(--grey-bg);border-radius:6px;overflow:hidden}
.bar-f{display:block;height:100%;border-radius:6px;min-width:2px}
.bar-n{width:28px;text-align:right;font-weight:bold}
.bf-verstuurd{background:#8FB3DA}.bf-ontvangen{background:#E0A100}.bf-actief{background:#1E6FC2}.bf-gereed{background:#2E7D32}.bf-afgekeurd{background:#C62828}.bf-geannuleerd{background:#9AA3AE}
.crumbs{margin:-6px 0 16px;font-size:13px}.crumbs a{text-decoration:none}.crumbs a:hover{text-decoration:underline}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px 18px;text-align:left;cursor:pointer;min-height:130px;display:flex;flex-direction:column;gap:6px;color:var(--text);transition:border-color .15s,box-shadow .15s}
.tile:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(0,112,192,.15)}
.tile .t-ic{font-size:22px;color:var(--blue)}
.tile .t-name{font-weight:bold;font-size:16px;color:var(--navy)}
.tile .t-name.big{font-size:26px}
.tile .t-sub{color:var(--muted);font-size:13px}
.tile .t-status{font-size:13px;margin-top:auto}
.tree ul{list-style:none;margin:0;padding-left:20px;border-left:1px dashed #C5CCD6}
.tree>ul{border-left:0;padding-left:0}
.tree li{padding:5px 0}
.tree .lvl{font-size:11px;color:var(--muted);margin-left:6px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:360px;z-index:50;transition:opacity .3s}
.muted{color:var(--muted)}
.mono{font-family:Consolas,monospace;font-size:12.5px;white-space:nowrap}
/* HMI */
.hmi{background:#2B3138;border-radius:10px;padding:14px;color:#E8ECF0;max-width:900px;box-shadow:inset 0 0 0 6px #1C2025}
.hmi .bar{display:flex;justify-content:space-between;font-size:13px;color:#AAB4BF;border-bottom:1px solid #47505A;padding-bottom:8px;margin-bottom:12px}
.hmi .panel{background:#363D45;border-radius:6px;padding:12px;margin-bottom:12px}
.hmi h3{margin:0 0 10px;font-size:14px;color:#fff}
.hmi .job{border:2px solid #4A535D;border-radius:6px;padding:10px;margin-bottom:8px;cursor:pointer}
.hmi .job.sel{border-color:#4FC3F7;background:#2F4656}
.hmi .big{font-size:30px;font-weight:bold;color:#fff}
.hmi .lbl{font-size:12px;color:#AAB4BF}
.hmi .prog{height:14px;background:#22272D;border-radius:7px;overflow:hidden;margin-top:8px}
.hmi .prog div{height:100%;background:#4CAF50;width:0;transition:width .4s}
.hmi .hbtn{border:0;border-radius:6px;padding:14px 22px;font-weight:bold;font-size:15px;cursor:pointer}
.hmi .start{background:#2E7D32;color:#fff}.hmi .stop{background:#C62828;color:#fff}.hmi .neutral{background:#56606B;color:#fff}
.hmi .hbtn:disabled{opacity:.35;cursor:not-allowed}
.hmi table td{border-bottom:1px solid #47505A;color:#E8ECF0;padding:5px 8px}
.hmi table th{background:#1F3864}
@media (max-width:900px){.wrap{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;padding:0;border-right:0;border-bottom:1px solid var(--line)}nav .sec{display:none}nav button{width:auto;white-space:nowrap;padding:10px 14px}nav button.active{border-left:0;border-bottom:3px solid var(--blue);padding-left:14px}.top .user{display:none}.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}main{padding:16px}}
</style>
</head>
<body>

<div class="demo-bar">
  <b>Demo-prototype</b><span>Steinweg Machineplatform, opgesteld door Synergo ter illustratie. Alle gegevens zijn fictief.</span>
  <span class="right">Bekijk als:</span>
  <select id="roleSel" aria-label="Demorol kiezen"></select>
  <button class="btn sm sec" id="resetBtn" title="Demo-gegevens terugzetten">Demo herstarten</button>
</div>

<div class="top">
  <div class="brand">Steinweg Machineplatform <span id="scopeLabel"></span></div>
  <div class="spacer"></div>
  <div class="user" id="userBox"></div>
</div>

<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<script>
// =====================================================================
// DEMO-GEGEVENS (fictief)
// =====================================================================
const LOCATIONS = [
  { id:'nl', name:'Nederland', level:'Land', parent:null },
  { id:'ams', name:'Amsterdam', level:'Site', parent:'nl' },
  { id:'ams-h7', name:'Hal 7', level:'Hal / positie', parent:'ams' },
  { id:'ams-h5', name:'Hal 5', level:'Hal / positie', parent:'ams' },
  { id:'ams-ut', name:'Utilities', level:'Hal / positie', parent:'ams' },
  { id:'bb', name:'Big bag installatie', level:'Lijn / entiteit', parent:'ams-h7', status:'online', type:'Big bag vulstation' },
  { id:'jb', name:'Jute bag filler', level:'Lijn / entiteit', parent:'ams-h5', status:'gepland', type:'Jutezakvuller' },
  { id:'cool', name:'Koelunit', level:'Lijn / entiteit', parent:'ams-ut', status:'gepland', type:'Koelinstallatie' },
  // Fictieve voorbeeldsites, alleen om het platformoverzicht te tonen
  { id:'sb', name:'Site B', level:'Site', parent:'nl' },
  { id:'sb-h1', name:'Hal 1', level:'Hal / positie', parent:'sb' },
  { id:'sb-h2', name:'Hal 2', level:'Hal / positie', parent:'sb' },
  { id:'sb-v1', name:'Vulstation B1', level:'Lijn / entiteit', parent:'sb-h1', status:'online', type:'Big bag vulstation' },
  { id:'sb-z1', name:'Zakkenvuller B2', level:'Lijn / entiteit', parent:'sb-h2', status:'offline', type:'Zakkenvuller' },
  { id:'sc', name:'Site C', level:'Site', parent:'nl' },
  { id:'sc-h1', name:'Hal 1', level:'Hal / positie', parent:'sc' },
  { id:'sc-ut', name:'Utilities', level:'Hal / positie', parent:'sc' },
  { id:'sc-v1', name:'Vulstation C1', level:'Lijn / entiteit', parent:'sc-h1', status:'online', type:'Big bag vulstation' },
  { id:'sc-k1', name:'Koelunit C', level:'Lijn / entiteit', parent:'sc-ut', status:'online', type:'Koelinstallatie' },
];

const ROLES = {
  platform: { label:'Platform admin', user:'R. de Vries (Steinweg IT)', scope:'nl', scopeName:'Alle sites' },
  siteadmin:{ label:'Site admin', user:'M. Bakker (teamleider)', scope:'ams', scopeName:'Site Amsterdam' },
  operator: { label:'Site operator', user:'J. Jansen', scope:'bb', scopeName:'Big bag installatie, Hal 7' },
  lezer:    { label:'Lezer', user:'S. de Boer (planning)', scope:'nl', scopeName:'Alle sites' },
  machine:  { label:'Machine operator', user:'OP-017 (HMI)', scope:'bb', scopeName:'HMI big bag installatie' },
};

// Rechtenmatrix uit STA001-FO-001
const CAN = {
  view:      ['platform','siteadmin','operator','lezer'],
  order:     ['platform','siteadmin','operator'],
  recipes:   ['platform','siteadmin','operator'],
  users:     ['platform','siteadmin'],
  locEdit:   ['platform'],
  audit:     ['platform','siteadmin'],
  hmi:       ['machine'],
};

// Orders zoals ze uit ERP General komen (fictief)
const GENERAL = {
  'ORD-10012': { customer:'Verhoef Handel B.V.', product:'PRD-A', productName:'Product A', lot:'LOT-0007', qty:12, weight:1150 },
  'ORD-10015': { customer:'Kestrel Commodities', product:'PRD-B', productName:'Product B', lot:'LOT-0011', qty:8, weight:1000 },
  'ORD-10020': { customer:'Brightwater Foods', product:'PRD-A', productName:'Product A', lot:'LOT-0009', qty:20, weight:1200 },
  'ORD-10022': { customer:'Lindholm & Co', product:'PRD-A', productName:'Product A', lot:'LOT-0012', qty:6, weight:900 },
  'ORD-10030': { customer:'Kestrel Commodities', product:'PRD-B', productName:'Product B', lot:'LOT-0021', qty:10, weight:1000 },
  'ORD-10031': { customer:'Verhoef Handel B.V.', product:'PRD-A', productName:'Product A', lot:'LOT-0022', qty:6, weight:1150 },
  'ORD-10033': { customer:'Brightwater Foods', product:'PRD-A', productName:'Product A', lot:'LOT-0024', qty:8, weight:1300 },
  'ORD-10035': { customer:'Brightwater Foods', product:'PRD-A', productName:'Product A', lot:'LOT-0031', qty:9, weight:1200 },
  'ORD-10036': { customer:'Kestrel Commodities', product:'PRD-B', productName:'Product B', lot:'LOT-0032', qty:14, weight:1000 },
};
const SILOS = ['Silo 1','Silo 2','Silo 3','Silo 4','Silo 5','Silo 6'];
const LIMITS = { min:500, max:1250 };

const START = () => ({
  recipes: [
    { id:'algemeen', client:'Algemeen recept', general:true, weight:1000, tol:5, sticker:['{KLANT}','ORDER {ORDER}','LOT {LOT}','',''] },
    { id:'verhoef', client:'Verhoef Handel B.V.', weight:1150, tol:5, sticker:['VERHOEF HANDEL','REF 000123','MARK VH-01','BESTEMMING X',''] },
    { id:'kestrel', client:'Kestrel Commodities', weight:1000, tol:4, sticker:['KESTREL','CONTRACT K-001','MARK KC-02','HERKOMST N.V.T.',''] },
    { id:'brightwater', client:'Brightwater Foods', weight:1200, tol:5, sticker:['BRIGHTWATER','PO 000456','MARK BW-03','Batch per order',''] },
  ],
  jobs: [],
  alarms: [],
  users: [
    { name:'R. de Vries', role:'Platform admin', site:null, scope:'Alle sites' },
    { name:'S. de Boer', role:'Lezer', site:null, scope:'Nederland' },
    { name:'M. Bakker', role:'Site admin', site:'ams', scope:'Site Amsterdam' },
    { name:'J. Jansen', role:'Site operator', site:'ams', scope:'Big bag installatie, Hal 7' },
    { name:'P. Visser', role:'Site operator', site:'ams', scope:'Hal 7' },
    { name:'L. Kok', role:'Site operator', site:'ams', scope:'Hal 5' },
    { name:'OP-017', role:'Machine operator', site:'ams', scope:'Big bag installatie, Hal 7' },
    { name:'OP-022', role:'Machine operator', site:'ams', scope:'Big bag installatie, Hal 7' },
    { name:'K. Mulder', role:'Lezer', site:'ams', scope:'Site Amsterdam' },
    { name:'E. Hendriks', role:'Site admin', site:'sb', scope:'Site B' },
    { name:'A. Smit', role:'Site operator', site:'sb', scope:'Site B' },
    { name:'OP-031', role:'Machine operator', site:'sb', scope:'Vulstation B1, Hal 1' },
    { name:'OP-034', role:'Machine operator', site:'sb', scope:'Zakkenvuller B2, Hal 2' },
    { name:'T. Bos', role:'Site admin', site:'sc', scope:'Site C' },
    { name:'N. Willems', role:'Site operator', site:'sc', scope:'Site C' },
    { name:'OP-041', role:'Machine operator', site:'sc', scope:'Vulstation C1, Hal 1' },
  ],
  audit: [],
  seq: 120,
});

let SEL = { site:null, hal:null, line:null };
let DB, ROLE = 'operator', VIEW = 'home', DETAIL = null, HMI_SEL = null, HMI_RUN = null, PREFILL = null;

function now(offsetMin=0){ return new Date(Date.now()+offsetMin*60000); }
function fmt(d){ return d.toLocaleString('nl-NL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function iso(d){ return d.toISOString().replace(/\.\d+Z$/,'Z'); }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function rnd(a,b){ return a+Math.random()*(b-a); }

function seed(){
  DB = START();
  const mk = (order, recipeId, silo, status, minsAgo, extra={}, line='bb', by='J. Jansen') => {
    const g = GENERAL[order]; const r = DB.recipes.find(x=>x.id===recipeId);
    const j = { id:'J2026-000'+(++DB.seq), order, line, customer:g.customer, product:g.product, productName:g.productName, lot:g.lot,
      qty:g.qty, weight:r.weight, tol:r.tol, silo, recipe:r.client, sticker:r.sticker.map(s=>fill(s,g,order)), remark:'',
      createdBy:by, created:now(-minsAgo), status, ...extra };
    DB.jobs.push(j); return j;
  };
  // Amsterdam, big bag installatie
  const a1 = mk('ORD-10015','kestrel','Silo 2','Gereed',300); a1.report = makeReport(a1,'OP-022',now(-280),true);
  mk('ORD-10022','algemeen','Silo 4','Afgekeurd',150,{ reason:'Silo 4 is buiten bedrijf voor onderhoud (foutcode E-SILO-04)' });
  mk('ORD-10020','brightwater','Silo 3','Ontvangen',25);
  // Site B
  const b1 = mk('ORD-10030','kestrel','Silo 1','Gereed',420,{},'sb-v1','A. Smit'); b1.report = makeReport(b1,'OP-031',now(-400),true);
  mk('ORD-10031','verhoef','Silo 2','Ontvangen',40,{},'sb-v1','A. Smit');
  mk('ORD-10033','brightwater','Silo 5','Afgekeurd',95,{ weight:1300, reason:'Gewicht per big bag (1300 kg) ligt boven het maximum van de machine (foutcode E-WGT-02)' },'sb-v1','A. Smit');
  // Site C
  const c1 = mk('ORD-10035','brightwater','Silo 1','Gereed',600,{},'sc-v1','N. Willems'); c1.report = makeReport(c1,'OP-041',now(-560),true);
  mk('ORD-10036','kestrel','Silo 2','Actief',30,{},'sc-v1','N. Willems');

  DB.alarms = [
    { line:'bb', t:now(-35), sev:'Waarschuwing', code:'W-PRN-02', text:'Stickerprinter: etiketrol bijna leeg', active:true },
    { line:'bb', t:now(-270), sev:'Storing', code:'E-WGT-11', text:'Weegcel: stabilisatietijd overschreden bij big bag 5', active:false },
    { line:'sb-v1', t:now(-12), sev:'Storing', code:'E-SAF-01', text:'Noodstop ingedrukt, zone 2', active:true },
    { line:'sb-z1', t:now(-180), sev:'Storing', code:'E-COM-01', text:'Geen verbinding met de machine (geen hartslag)', active:true },
    { line:'sc-k1', t:now(-75), sev:'Waarschuwing', code:'W-TMP-03', text:'Retourtemperatuur boven ingestelde waarde', active:false },
  ];

  log('R. de Vries','Site admin aangewezen','T. Bos voor Site C',-1440,null);
  log('J. Jansen','Opdracht verstuurd','ORD-10015 naar Big bag installatie',-300,'ams');
  log('Machine','Rapport ontvangen','ORD-10015, 8 big bags, COMPLETE',-210,'ams');
  log('J. Jansen','Opdracht verstuurd','ORD-10022 naar Big bag installatie',-150,'ams');
  log('Machine','Opdracht afgekeurd','ORD-10022: Silo 4 buiten bedrijf',-149,'ams');
  log('M. Bakker','Gebruiker toegevoegd','OP-022 als Machine operator, Big bag installatie',-90,'ams');
  log('J. Jansen','Klantrecept gewijzigd','Brightwater Foods: stickerregel 2',-40,'ams');
  log('Machine','Waarschuwing','Big bag installatie: W-PRN-02 etiketrol bijna leeg',-35,'ams');
  log('J. Jansen','Opdracht verstuurd','ORD-10020 naar Big bag installatie',-25,'ams');
  log('Platform','Verbinding verbroken','Zakkenvuller B2 geeft geen hartslag meer',-180,'sb');
  log('A. Smit','Opdracht verstuurd','ORD-10033 naar Vulstation B1',-95,'sb');
  log('Machine','Opdracht afgekeurd','ORD-10033: gewicht boven maximum',-94,'sb');
  log('Machine','Storing','Vulstation B1: E-SAF-01 noodstop zone 2',-12,'sb');
  log('N. Willems','Opdracht verstuurd','ORD-10036 naar Vulstation C1',-30,'sc');
  log('OP-041','Opdracht gestart op HMI','ORD-10036',-28,'sc');
  DB.audit.sort((a,b)=>b.t-a.t);
}

function fill(s,g,order){ return s.replace('{KLANT}',g.customer.toUpperCase()).replace('{ORDER}',order).replace('{LOT}',g.lot); }
function log(who,what,detail,off=0,site='ams'){ DB.audit.unshift({ t:now(off), who, what, detail, site }); }

function makeReport(job, op, start, complete=true, bagsDone){
  const n = bagsDone ?? job.qty; const bags=[]; let t=new Date(start); let total=0, out=0, stops=0, down=0;
  for(let i=1;i<=n;i++){
    const dur = rnd(6.8,7.8); const w = +(job.weight + rnd(-job.tol*0.9, job.tol*0.9)).toFixed(1);
    let ok = Math.abs(w-job.weight)<=job.tol; if(i===5 && n>6){ stops++; down+=4.5; t=new Date(t.getTime()+4.5*60000); }
    const s=new Date(t); t=new Date(t.getTime()+dur*60000); bags.push({ no:i, w, ok, s, e:new Date(t), dur:+dur.toFixed(1) });
    total+=w; if(!ok) out++;
  }
  const runtime = bags.reduce((a,b)=>a+b.dur,0);
  return { start, end:t, runtime:+runtime.toFixed(1), downtime:+down.toFixed(1), stops, alarms:stops, bags, total:+total.toFixed(1), out,
    operator:op, status: complete?'COMPLETE':'ABORTED' };
}

const loc = id => LOCATIONS.find(l=>l.id===id);
const childrenOf = id => LOCATIONS.filter(l=>l.parent===id);
function ancestors(id){ const out=[]; let l=loc(id); while(l){ out.push(l.id); l=loc(l.parent); } return out; }
const isBB = id => { const l=loc(id); return !!l && l.type==='Big bag vulstation'; };
function siteOf(id){ return ancestors(id).find(x=>loc(x).level==='Site') || null; }
const siteName = id => id ? loc(id).name : 'Platform';
const byName = (a,b)=>a.name.localeCompare(b.name,'nl',{numeric:true});
// Een lijn is zichtbaar als de scope van de rol de lijn zelf of een bovenliggend niveau is.
function visibleLines(){ const sc=ROLES[ROLE].scope; return LOCATIONS.filter(l=>l.level==='Lijn / entiteit' && ancestors(l.id).includes(sc)); }
function visibleHalls(siteId){ const ids=new Set(visibleLines().map(l=>l.parent)); return childrenOf(siteId).filter(h=>ids.has(h.id)).sort(byName); }
function visibleSites(){ const ids=new Set(visibleLines().map(l=>siteOf(l.id))); return LOCATIONS.filter(l=>ids.has(l.id)); }
function jobsInScope(){ const ids=new Set(visibleLines().map(l=>l.id)); return DB.jobs.filter(j=>ids.has(j.line)); }
function alarmsInScope(){ const ids=new Set(visibleLines().map(l=>l.id)); return DB.alarms.filter(a=>ids.has(a.line)).sort((a,b)=>(b.active-a.active)||(b.t-a.t)); }
function lineJobs(id){ return DB.jobs.filter(j=>j.line===id); }
function activeAlarms(id){ return DB.alarms.filter(a=>a.line===id && a.active); }
function lineState(l){
  if(l.status==='gepland') return { dot:'off', text:'Nog niet aangesloten' };
  if(l.status==='offline') return { dot:'err', text:'Offline (geen verbinding)' };
  if(activeAlarms(l.id).some(a=>a.sev==='Storing')) return { dot:'err', text:'Storing' };
  if(lineJobs(l.id).some(j=>j.status==='Actief')) return { dot:'warn', text:'In bedrijf' };
  return { dot:'on', text:'Verbonden' };
}

function statusBars(J){
  const S=['Verstuurd','Ontvangen','Actief','Gereed','Afgekeurd','Geannuleerd'];
  const max=Math.max(1,...S.map(x=>J.filter(j=>j.status===x).length));
  return `<div class="bars">${S.map(x=>{ const n=J.filter(j=>j.status===x).length;
    return `<div class="bar-row"><span class="bar-l">${x}</span><span class="bar-t"><span class="bar-f bf-${x.toLowerCase()}" style="width:${Math.round(n/max*100)}%"></span></span><span class="bar-n">${n}</span></div>`; }).join('')}</div>`;
}
function alarmTable(list, showLine=true){
  if(!list.length) return '<p class="muted" style="margin:0">Geen storingen.</p>';
  return `<table><tr><th>Tijd</th>${showLine?'<th>Machine</th>':''}<th>Melding</th><th>Status</th></tr>
    ${list.map(a=>`<tr${a.active?'':' class="resolved"'}><td style="white-space:nowrap">${fmt(a.t)}</td>${showLine?`<td>${esc(loc(a.line).name)}<br><span class="muted">${esc(siteName(siteOf(a.line)))}</span></td>`:''}
      <td><span class="badge b-${a.sev.toLowerCase()}">${a.sev}</span> <span class="mono">${esc(a.code)}</span><br>${esc(a.text)}</td>
      <td>${a.active?'<b>Actief</b>':'Opgelost'}</td></tr>`).join('')}</table>`;
}
function kpi(v,l,alert){ return `<div class="card kpi"><div class="v"${alert?' style="color:var(--err)"':''}>${v}</div><div class="l">${l}</div></div>`; }

function crumbs(){
  const parts=[`<a href="#" data-crumb="root">${siteLabel()}</a>`];
  if(SEL.site && visibleSites().length>1) parts.push(`<a href="#" data-crumb="site">${esc(loc(SEL.site).name)}</a>`);
  else if(SEL.site && (SEL.hal||SEL.line)) parts.push(`<a href="#" data-crumb="site">${esc(loc(SEL.site).name)}</a>`);
  if(SEL.hal) parts.push(`<a href="#" data-crumb="hal">${esc(loc(SEL.hal).name)}</a>`);
  if(SEL.line) parts.push(`<b>${esc(loc(SEL.line).name)}</b>`);
  return `<div class="crumbs">${parts.join(' <span class="muted">›</span> ')}</div>`;
}
function bindCrumbs(){
  document.querySelectorAll('[data-crumb]').forEach(a=>a.onclick=e=>{ e.preventDefault();
    const c=a.dataset.crumb;
    if(c==='root'){ resetSel(); }
    if(c==='site'){ SEL.hal=null; SEL.line=null; }
    if(c==='hal'){ SEL.line=null; }
    go('site'); });
}

function vSite(){
  const sites=visibleSites();

  <div class="tiles">${lines.map(l=>{ const st=lineState(l); const J=lineJobs(l.id);

      <div class="t-sub">${esc(l.type)}</div>
      <div class="t-status"><span class="dot ${st.dot}"></span>${st.text}</div>
      ${l.status==='online'&&isBB(l.id)?`<div class="t-sub">${act?`Actief: ${esc(act.order)}`:`${waiting} klaar op de machine`}</div>`:''}</button>`; }).join('')}</div>`;
}

function machineHead(){

function machineTabs(active){

  const l=loc(SEL.line); const st=lineState(l);

      <tr><td class="muted">Integratiepunt</td><td><span class="dot on"></span>Siemens switch, verbonden</td></tr>
      <tr><td class="muted">Laatste rapport</td><td>${last?`${esc(last.order)} · ${last.report.total.toLocaleString('nl-NL')} kg · ${fmt(last.report.end)}`:'Nog geen rapport'}</td></tr>

}

function hOperator(){
  const J=jobsInScope(); const A=alarmsInScope(); const openA=A.filter(a=>a.active);
  const act=J.filter(j=>j.status==='Actief'), wait=J.filter(j=>['Verstuurd','Ontvangen'].includes(j.status)), rej=J.filter(j=>j.status==='Afgekeurd' && !J.some(k=>k.order===j.order && k.created>j.created));
  const line=visibleLines().find(l=>isBB(l.id));
  return `<h1>Mijn werk</h1><p class="sub">${esc(ROLES[ROLE].scopeName)}: storingen en opdrachten die aandacht nodig hebben.</p>
  <div class="grid g4">${kpi(openA.length,'Open storingen',openA.length>0)}${kpi(act.length,'Actieve opdrachten')}${kpi(wait.length,'Klaar op de machine')}${kpi(rej.length,'Afgekeurde opdrachten',rej.length>0)}</div>
  <div class="row" style="margin-bottom:16px"><button class="btn" data-go="new">＋ Nieuwe opdracht</button>${line?`<button class="btn sec" data-goline="${line.id}">Naar ${esc(line.name)}</button>`:''}</div>
  <div class="card"><h2>Storingen</h2>${alarmTable(A,false)}<p class="muted" style="font-size:12px;margin:8px 0 0">De machine geeft storingen en waarschuwingen door als statusmelding.</p></div>
  <div class="grid g2">
    <div class="card"><h2>Afgekeurde opdrachten</h2>${rej.length?`<table><tr><th>Order</th><th>Reden</th><th></th></tr>
      ${rej.map(j=>`<tr class="click" data-job="${j.id}"><td class="mono">${esc(j.order)}</td><td>${esc(j.reason)}</td><td><button class="btn sm sec" data-redo="${j.id}">Opnieuw</button></td></tr>`).join('')}</table>`:'<p class="muted" style="margin:0">Geen afgekeurde opdrachten.</p>'}</div>
    <div class="card"><h2>Actief en klaar op de machine</h2>${act.length+wait.length?`<table><tr><th>Order</th><th>Klant</th><th>Big bags</th><th>Status</th></tr>
      ${[...act,...wait].map(j=>`<tr class="click" data-job="${j.id}"><td class="mono">${esc(j.order)}</td><td>${esc(j.customer)}</td><td>${j.qty} × ${j.weight} kg</td><td>${badge(j.status)}</td></tr>`).join('')}</table>`:'<p class="muted" style="margin:0">Geen opdrachten.</p>'}</div>
  </div>`;
}

function hLezer(){
  const J=jobsInScope(); const R=J.filter(j=>j.report).sort((a,b)=>b.report.end-a.report.end);
  const kg=R.reduce((a,j)=>a+j.report.total,0); const lines=visibleLines(); const on=lines.filter(l=>l.status==='online').length;
  return `<h1>Overzicht</h1><p class="sub">${esc(ROLES[ROLE].scopeName)}: opdrachten en rapporten, alleen lezen.</p>
  <div class="grid g4">${kpi(R.length,'Opdrachten gereed')}${kpi(Math.round(kg).toLocaleString('nl-NL')+' kg','Totaal gevuld')}${kpi(J.filter(j=>j.status==='Actief').length,'Nu actief')}${kpi(`${on} / ${lines.length}`,'Assets online')}</div>
  <div class="grid g2">
    <div class="card"><div class="row"><h2 style="margin:0">Recente rapporten</h2><button class="btn sm sec right" data-go="reports">Alle rapporten</button></div>
      <table style="margin-top:10px"><tr><th>Order</th><th>Machine</th><th>Totaal</th><th>Gereed</th></tr>
      ${R.slice(0,6).map(j=>`<tr class="click" data-job="${j.id}"><td class="mono">${esc(j.order)}</td><td>${esc(loc(j.line).name)}<br><span class="muted">${esc(siteName(siteOf(j.line)))}</span></td><td>${j.report.total.toLocaleString('nl-NL')} kg</td><td>${fmt(j.report.end)}</td></tr>`).join('')}</table></div>
    <div class="card"><h2>Opdrachtstatus</h2>${statusBars(J)}</div>
  </div>`;
}

      <div class="field"><label>Ordernummer (ERP General)</label>

      <div class="field"><label>Klantrecept</label><select id="fRecipe" disabled>
        ${rec.map(r=>`<option value="${r.id}">${esc(r.client)}${r.general?' (voor nieuwe klanten)':''}</option>`).join('')}</select></div>
      <div class="grid g2">
        <div class="field"><label>Bronsilo</label><select id="fSilo" disabled><option value="">Kies silo</option>${SILOS.map(s=>`<option>${s}</option>`).join('')}</select><div class="err" id="eSilo"></div></div>
        <div class="field"><label>Gewicht per big bag (kg)</label><input id="fWeight" type="number" disabled><div class="err" id="eWeight"></div></div>
        <div class="field"><label>Tolerantie ± (kg)</label><input id="fTol" type="number" disabled></div>
        <div class="field"><label>Opmerking voor HMI</label><input id="fRemark" disabled placeholder="Optioneel"></div>
      </div>
      <label>Stickerregels</label>
      ${[0,1,2,3,4].map(i=>`<input class="fSt" data-i="${i}" disabled style="margin-bottom:6px" maxlength="28">`).join('')}
    </div>
  </div>
  <div>
    <div class="card"><h2>Stickervoorbeeld</h2><div class="sticker" id="stPrev"><span class="muted">Nog geen order</span></div>
      <div class="muted" style="font-size:12px;margin-top:8px">Gewicht en volgnummer worden door de machine per big bag toegevoegd.</div></div>
    <div class="card"><h2>Opdrachtbestand (CSV) naar de machine</h2><pre class="csv" id="csvPrev">Nog geen gegevens</pre></div>
    <div class="row"><button class="btn" id="fSend" disabled>Opdracht versturen</button><button class="btn sec" id="fClear">Leegmaken</button>
      <span class="err" id="eSend"></span></div>
  </div></div>`;

let FORM=null;
function csvFor(j){
  const h='SchemaVersion;Action;JobID;LineID;OrderNo;Customer;ProductCode;LotNo;Quantity;Remark;CreatedBy;CreatedAt;Recipe;SourceSilo;TargetWeight_kg;Tolerance_kg;Sticker1;Sticker2;Sticker3;Sticker4;Sticker5';
  const q=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  const v=['1.0','NEW',j.id||'(bij verzenden)','<lijnkenmerk>',j.order,q(j.customer),j.product,j.lot,j.qty,q(j.remark),j.createdBy,j.created?iso(j.created):'(bij verzenden)',
    q(j.recipe),j.silo||'',j.weight||'',j.tol||'',...j.sticker.map(q)].join(';');
  return h+'\n'+v;
}

const bind = {
  dashboard(){ bindCrumbs(); },
  home(){},
  site(){
    bindCrumbs();
    document.querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>{ SEL={site:b.dataset.site,hal:null,line:null}; go('site'); });
    document.querySelectorAll('[data-hal]').forEach(b=>b.onclick=()=>{ SEL.hal=b.dataset.hal; SEL.line=null; go('site'); });
    document.querySelectorAll('[data-line]').forEach(b=>b.onclick=()=>{ SEL.line=b.dataset.line; go('dashboard'); });
  },
  new(){
    bindCrumbs();
    const $=id=>document.getElementById(id);
    const editable=['fRecipe','fSilo','fWeight','fTol','fRemark'];
    const stEls=[...document.querySelectorAll('.fSt')];
    function setEnabled(on){ editable.forEach(i=>$(i).disabled=!on); stEls.forEach(e=>e.disabled=!on); $('fSend').disabled=!on; }
    function applyRecipe(){
      const r=DB.recipes.find(x=>x.id===$('fRecipe').value); const g=FORM.g;
      $('fWeight').value=r.weight; $('fTol').value=r.tol;
      stEls.forEach((e,i)=>e.value=fill(r.sticker[i]||'',g,FORM.order));
      update();
    }
    function current(){
      return { order:FORM.order, customer:FORM.g.customer, product:FORM.g.product, lot:FORM.g.lot, qty:FORM.g.qty,
        recipe:DB.recipes.find(x=>x.id===$('fRecipe').value).client, silo:$('fSilo').value, weight:+$('fWeight').value, tol:+$('fTol').value,
        remark:$('fRemark').value, sticker:stEls.map(e=>e.value), createdBy:ROLES[ROLE].user.split(' (')[0] };
    }
    function update(){
      if(!FORM) return; const j=current();
      $('stPrev').innerHTML = j.sticker.filter(Boolean).map(esc).join('<br>') + `<br><span class="muted">GEWICHT: ____ kg · BAG __/${j.qty}</span>`;
      $('csvPrev').textContent = csvFor(j);
      const w=j.weight; $('eWeight').textContent = (w<LIMITS.min||w>LIMITS.max)?`Gewicht moet tussen ${LIMITS.min} en ${LIMITS.max} kg liggen.`:'';
      $('eSilo').textContent='';
    }
    $('fFetch').onclick=()=>{
      const o=$('fOrder').value.trim().toUpperCase(); $('eOrder').textContent='';
      if(!o){ $('eOrder').textContent='Vul een ordernummer in.'; return; }
      $('fFetch').textContent='Ophalen…';
      setTimeout(()=>{
        $('fFetch').textContent='Ophalen';
        const g=GENERAL[o];
        if(!g){ $('eOrder').textContent='Ordernummer niet gevonden in ERP General.'; FORM=null; setEnabled(false); return; }
        FORM={order:o,g}; $('fOrder').value=o;
        $('fCust').value=g.customer; $('fProd').value=`${g.product} · ${g.productName}`; $('fLot').value=g.lot; $('fQty').value=g.qty;
        const r=DB.recipes.find(x=>x.client===g.customer) || DB.recipes.find(x=>x.general);
        $('fRecipe').value=r.id; setEnabled(true); applyRecipe();
        toast(r.general?`Geen klantrecept voor ${g.customer}: algemeen recept geselecteerd.`:`Ordergegevens opgehaald, recept ${r.client} geselecteerd.`);
      },600);
    };
    $('fOrder').addEventListener('keydown',e=>{ if(e.key==='Enter') $('fFetch').click(); $('eOrder').textContent=''; });
    $('fRecipe').onchange=applyRecipe;
    ['fSilo','fWeight','fTol','fRemark'].forEach(i=>$(i).oninput=update);
    stEls.forEach(e=>e.oninput=update);
    $('fClear').onclick=()=>{ FORM=null; go('new'); };
    if(PREFILL){ $('fOrder').value=PREFILL; PREFILL=null; $('fFetch').click(); }
    $('fSend').onclick=()=>{
      const j=current(); let bad=false;
      if(!j.silo){ $('eSilo').textContent='Kies een bronsilo.'; bad=true; }
      if(j.weight<LIMITS.min||j.weight>LIMITS.max){ bad=true; }
      if(bad){ $('eSend').textContent='Controleer de gemarkeerde velden.'; return; }
      const line=$('fLine').value; const lname=loc(line).name;
      const job={ ...j, id:'J2026-000'+(++DB.seq), line, productName:FORM.g.productName, created:now(), status:'Verstuurd' };
      DB.jobs.push(job); log(job.createdBy,'Opdracht verstuurd',`${job.order} naar ${lname}`,0,siteOf(line));
      FORM=null; toast(`Opdracht ${job.order} verstuurd naar de machine.`);
      setTimeout(()=>{ job.status='Ontvangen'; log('Machine','Ontvangstbevestiging',`${job.order}: OK`,0,siteOf(line)); toast(`Machine bevestigt ontvangst van ${job.order}.`); if(['jobs','dashboard','job','home'].includes(VIEW)) render(); },2500);
      go('job',job.id);
    };
  },
  jobs(){ bindJobRows(); document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{JOBFILTER=b.dataset.f; render();}); },
  job(){
    const c=document.getElementById('cancelBtn'); if(c) c.onclick=()=>{ const j=DB.jobs.find(x=>x.id===DETAIL); j.status='Geannuleerd'; log(ROLES[ROLE].user.split(' (')[0],'Opdracht geannuleerd',j.order,0,siteOf(j.line)); toast('Opdracht geannuleerd; de machine ontvangt een CANCEL-bestand.'); render(); };
    const d=document.getElementById('dlBtn'); if(d) d.onclick=()=>downloadReport(DB.jobs.find(x=>x.id===DETAIL));
    const b=document.getElementById('backBtn'); if(b) b.onclick=()=>go('jobs');
  },
  reports(){ bindJobRows(); document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=e=>{e.stopPropagation(); downloadReport(DB.jobs.find(x=>x.id===b.dataset.dl));}); },
  recipes(){
    bindCrumbs();
    const $=id=>document.getElementById(id);
    document.querySelectorAll('[data-rec]').forEach(r=>r.onclick=()=>{ EDITREC=r.dataset.rec; render(); });
    const nb=$('newRec'); if(nb) nb.onclick=()=>{ EDITREC='__new'; render(); };
    const sv=$('saveRec'); if(sv) sv.onclick=()=>{
      const client=$('rClient').value.trim(); if(!client){ $('eClient').textContent='Vul een klantnaam in.'; return; }
      const w=+$('rWeight').value; if(w<LIMITS.min||w>LIMITS.max){ $('eW').textContent=`Tussen ${LIMITS.min} en ${LIMITS.max} kg.`; return; }
      const st=[...document.querySelectorAll('.rSt')].map(e=>e.value);
      if(EDITREC==='__new'){ DB.recipes.push({ id:'r'+Date.now(), client, weight:w, tol:+$('rTol').value, sticker:st }); log(ROLES[ROLE].user.split(' (')[0],'Klantrecept aangemaakt',client,0,siteOf(SEL.line)); toast(`Klantrecept ${client} aangemaakt.`); }
      else { const r=DB.recipes.find(x=>x.id===EDITREC); Object.assign(r,{client: r.general?r.client:client, weight:w, tol:+$('rTol').value, sticker:st}); log(ROLES[ROLE].user.split(' (')[0],'Klantrecept gewijzigd',r.client,0,siteOf(SEL.line)); toast('Klantrecept opgeslagen.'); }
      EDITREC=null; render();
    };
    const cc=$('cancelRec'); if(cc) cc.onclick=()=>{ EDITREC=null; render(); };
    ['rClient','rWeight'].forEach(i=>{ const e=$(i); if(e) e.oninput=()=>{ $('eClient').textContent=''; $('eW').textContent=''; }; });
  },
  users(){
    const $=id=>document.getElementById(id);
    const a=$('addUser'); if(a) a.onclick=()=>{
      const n=$('uName').value.trim(); if(!n){ $('eU').textContent='Vul een naam in.'; return; }
      const role=$('uRole').value, sid=$('uScope').value, l=loc(sid);
      if(role==='Site admin' && l.level!=='Site'){ $('eS').textContent='Een site admin krijgt altijd een hele site als scope.'; return; }
      const scope=scopeName(l); const site=siteOf(sid);
      DB.users.push({ name:n, role, site, scope }); log(ROLES[ROLE].user.split(' (')[0], role==='Site admin'?'Site admin aangewezen':'Gebruiker toegevoegd', `${n} als ${role}, ${scope}`, 0, site);
      toast(`${n} toegevoegd als ${role}.`); render();
    };
    const u=$('uName'); if(u) u.oninput=()=>$('eU').textContent='';
    ['uRole','uScope'].forEach(i=>{ const e=$(i); if(e) e.onchange=()=>$('eS').textContent=''; });
  },
  locations(){},
  audit(){},
  hmi(){
    document.querySelectorAll('.hmi .job').forEach(e=>e.onclick=()=>{ if(HMI_RUN) return; HMI_SEL=e.dataset.id; render(); });
    const s=document.getElementById('hStart'); if(s) s.onclick=hmiStart;
    const st=document.getElementById('hStop'); if(st) st.onclick=()=>hmiFinish(false);
  },
};

let JOBFILTER='Alle', EDITREC=null;
function bindJobRows(){ document.querySelectorAll('[data-job]').forEach(r=>r.onclick=()=>go('job',r.dataset.job)); }

function vJobs(){
  const filters=['Alle','Ontvangen','Actief','Gereed','Afgekeurd','Geannuleerd'];
  const multi=visibleSites().length>1;
  const list=jobsInScope().filter(j=>JOBFILTER==='Alle'||j.status===JOBFILTER).sort((a,b)=>b.created-a.created);
  return `<h1>Opdrachten</h1><p class="sub">Alle opdrachten binnen uw scope: ${esc(ROLES[ROLE].scopeName)}.</p>
  <div class="row" style="margin-bottom:12px">${filters.map(f=>`<button class="btn sm ${JOBFILTER===f?'':'sec'}" data-f="${f}">${f}</button>`).join('')}
  ${ROLE==='operator'?'<button class="btn sm right" data-go="new">＋ Nieuwe opdracht</button>':''}</div>
  <div class="card" style="padding:0;overflow:auto"><table>
    <tr><th>Opdracht</th><th>Order</th><th>Klant</th><th>Machine</th><th>Silo</th><th>Big bags</th><th>Verstuurd</th><th>Status</th></tr>
    ${list.map(j=>`<tr class="click" data-job="${j.id}"><td class="mono">${j.id}</td><td class="mono">${esc(j.order)}</td><td>${esc(j.customer)}</td>
      <td>${esc(loc(j.line).name)}${multi?`<br><span class="muted">${esc(siteName(siteOf(j.line)))}</span>`:''}</td><td>${esc(j.silo)}</td><td>${j.qty} × ${j.weight} kg</td><td>${fmt(j.created)}</td><td>${badge(j.status)}</td></tr>`).join('') || '<tr><td colspan="8" class="muted">Geen opdrachten met deze status.</td></tr>'}
  </table></div>`;
}

function vJob(){
  const j=jobsInScope().find(x=>x.id===DETAIL); if(!j) return vJobs();
  const canCancel = can('order') && ['Verstuurd','Ontvangen'].includes(j.status);
  const steps=['Verstuurd','Ontvangen','Actief','Gereed'];
  const idx=steps.indexOf(j.status);
  return `<button class="btn sm sec" id="backBtn">← Opdrachten</button>
  <h1 style="margin-top:12px">Opdracht ${esc(j.order)} ${badge(j.status)}</h1><p class="sub">${j.id} · ${esc(loc(j.line).name)}, ${esc(siteName(siteOf(j.line)))} ${esc(loc(loc(j.line).parent).name)} · verstuurd door ${esc(j.createdBy)} op ${fmt(j.created)}</p>
  ${j.status==='Afgekeurd'?`<div class="note" style="background:var(--err-bg);border-color:var(--err)"><b>Afgekeurd door de machine:</b> ${esc(j.reason)}</div>`:''}
  ${idx>=0?`<div class="card"><div class="row" style="gap:0">${steps.map((s,i)=>`<div style="flex:1;text-align:center;padding:6px;border-bottom:4px solid ${i<=idx?'var(--blue)':'var(--line)'};${i<=idx?'font-weight:bold;color:var(--navy)':'color:var(--muted)'}">${s}</div>`).join('')}</div>
    ${j.status==='Ontvangen'?'<p class="muted" style="margin:10px 0 0">De opdracht staat klaar op de HMI. Een machine operator selecteert en start hem daar.</p>':''}</div>`:''}
  <div class="grid g2">
    <div class="card"><h2>Gegevens</h2><table>
      ${[['Klant',j.customer],['Product',`${j.product} · ${j.productName}`],['Partij / lot',j.lot],['Klantrecept',j.recipe],['Bronsilo',j.silo],['Aantal big bags',j.qty],['Gewicht per big bag',`${j.weight} kg ± ${j.tol}`],['Opmerking',j.remark||'—']]
        .map(([k,v])=>`<tr><td class="muted" style="width:40%">${k}</td><td>${esc(v)}</td></tr>`).join('')}</table>
      ${canCancel?'<div style="margin-top:12px"><button class="btn danger" id="cancelBtn">Opdracht annuleren</button></div>':''}</div>
    <div class="card"><h2>Sticker</h2><div class="sticker">${j.sticker.filter(Boolean).map(esc).join('<br>')}<br>GEWICHT: ${j.report?j.report.bags[0].w:'____'} kg · BAG 1/${j.qty}</div>
      <h2 style="margin-top:16px">Opdrachtbestand</h2><pre class="csv">${esc(csvFor(j))}</pre></div>
  </div>
  ${j.report?reportBlock(j):''}`;
}

function reportBlock(j){
  const r=j.report;
  return `<div class="card"><div class="row"><h2 style="margin:0">Rapport ${r.status==='ABORTED'?badge('Afgekeurd').replace('Afgekeurd','Afgebroken'):''}</h2><button class="btn sm sec right" id="dlBtn">Rapport downloaden (CSV)</button></div>
    <div class="grid g4" style="margin:14px 0">
      <div class="kpi"><div class="v">${r.total.toLocaleString('nl-NL')} kg</div><div class="l">Totaalgewicht</div></div>
      <div class="kpi"><div class="v">${r.bags.length} / ${j.qty}</div><div class="l">Big bags gevuld</div></div>
      <div class="kpi"><div class="v">${r.runtime} min</div><div class="l">Looptijd</div></div>
      <div class="kpi"><div class="v">${r.downtime} min</div><div class="l">Stilstand (${r.stops} stop, ${r.alarms} alarm)</div></div>
    </div>
    <div class="muted" style="margin-bottom:8px">Start ${fmt(r.start)} · einde ${fmt(r.end)} · machine operator ${esc(r.operator)} · ${r.out} big bags buiten tolerantie</div>
    <div style="overflow:auto"><table><tr><th>Bag</th><th>Gewicht</th><th>Binnen tolerantie</th><th>Start</th><th>Einde</th><th>Duur</th></tr>
    ${r.bags.map(b=>`<tr><td>${b.no}</td><td>${b.w} kg</td><td>${b.ok?'✓':'<span style="color:var(--err)">✗</span>'}</td><td>${fmt(b.s)}</td><td>${fmt(b.e)}</td><td>${b.dur} min</td></tr>`).join('')}
    </table></div></div>`;
}

function downloadReport(j){
  const r=j.report; if(!r) return;
  let s='SchemaVersion;RecordType;JobID;OrderNo;StartTime;EndTime;Runtime_min;Downtime_min;StopCount;AlarmCount;QuantityProduced;OperatorID;Status;BagNo;Weight_kg;InTolerance;SourceSilo\n';
  r.bags.forEach(b=>s+=`1.0;DETAIL;${j.id};${j.order};${iso(b.s)};${iso(b.e)};${b.dur};0;0;0;;${r.operator};;${b.no};${b.w};${b.ok?1:0};${j.silo}\n`);
  s+=`1.0;TOTAL;${j.id};${j.order};${iso(r.start)};${iso(r.end)};${r.runtime};${r.downtime};${r.stops};${r.alarms};${r.bags.length};${r.operator};${r.status};;${r.total};${r.out};${j.silo}\n`;
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'})); a.download=`Rapport_${j.order}.csv`; a.click();
}

    <div class="field"><label>Klant</label><input id="rClient" value="${esc(editing.client)}" ${editing.general?'readonly':''} placeholder="Naam zoals in ERP General"><div class="err" id="eClient"></div></div>

    <div class="row"><button class="btn" id="saveRec">Opslaan</button><button class="btn sec" id="cancelRec">Annuleren</button></div>`

function vLocations(){
  const kids=id=>LOCATIONS.filter(l=>l.parent===id);
  const node=l=>`<li>${l.level==='Lijn / entiteit'?`<span class="dot ${l.status==='online'?'on':'off'}"></span>`:''}<b>${esc(l.name)}</b><span class="lvl">${l.level}${l.type?' · '+l.type:''}${l.status&&l.status!=='online'?' · '+l.status:''}</span>
    ${kids(l.id).length?`<ul>${kids(l.id).map(node).join('')}</ul>`:''}</li>`;
  return `<h1>Locaties en lijnen</h1><p class="sub">Land, site, hal of positie, en lijn. De lijn is de kleinste eenheid.</p>
  ${can('locEdit')?'':'<div class="note">Alleen een Platform admin kan locaties en lijnen toevoegen of wijzigen.</div>'}
  <div class="grid g2"><div class="card tree"><ul>${node(LOCATIONS[0])}</ul></div>
  <div class="card"><h2>Lijninstellingen: Big bag installatie</h2><table>
    <tr><td class="muted">Type</td><td>Big bag vulstation met weging en stickerprinter</td></tr>
    <tr><td class="muted">Bronsilo's</td><td>${SILOS.join(', ')}</td></tr>
    <tr><td class="muted">Gewicht per big bag</td><td>${LIMITS.min} tot ${LIMITS.max} kg</td></tr>
    <tr><td class="muted">Stickerregels</td><td>5 regels, max. 28 tekens</td></tr>
    <tr><td class="muted">Integratiepunt</td><td><span class="dot on"></span>Verbonden (Siemens switch)</td></tr>
    <tr><td class="muted">Bestandsopbouw</td><td>SchemaVersion 1.0</td></tr>
  </table>${can('locEdit')?'<div style="margin-top:12px"><button class="btn sec" onclick="toast(\'In de demo zijn lijninstellingen alleen-lezen.\')">Instellingen wijzigen</button></div>':''}</div></div>`;

function scopeName(l){
  if(l.level==='Land') return l.name;
  if(l.level==='Site') return `Site ${l.name}`;
  if(l.level==='Hal / positie') return `${l.name}, ${loc(l.parent).name}`;
  return `${l.name}, ${loc(l.parent).name}`;
}
function vUsers(){
  const isSite = ROLE==='siteadmin'; const mySite = ROLES[ROLE].scope;
  const roles = isSite ? ['Site operator','Machine operator','Lezer'] : ['Site admin','Site operator','Machine operator','Lezer'];
  const scopes = LOCATIONS.filter(l=> isSite ? (l.level!=='Land' && ancestors(l.id).includes(mySite)) : true);
  const list = isSite ? DB.users.filter(u=>u.site===mySite) : [...DB.users].sort((a,b)=>siteName(a.site).localeCompare(siteName(b.site)));
  return `<h1>Gebruikers</h1><p class="sub">${isSite?`Als site admin voegt u site operators, machine operators en lezers toe binnen Site ${esc(loc(mySite).name)}.`:'Als Platform admin wijst u per site de site admins aan en beheert u alle gebruikers.'}</p>
  <div class="grid g2"><div class="card" style="padding:0;overflow:auto"><table><tr><th>Naam</th><th>Rol</th>${isSite?'':'<th>Site</th>'}<th>Scope</th></tr>
    ${list.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.role)}</td>${isSite?'':`<td>${esc(siteName(u.site))}</td>`}<td>${esc(u.scope)}</td></tr>`).join('')}</table></div>
  <div class="card"><h2>${isSite?'Gebruiker toevoegen':'Gebruiker toevoegen of site admin aanwijzen'}</h2>

// =====================================================================
function vHmi(){
  const waiting=DB.jobs.filter(j=>j.line==='bb' && j.status==='Ontvangen').sort((a,b)=>a.created-b.created);
  const active=DB.jobs.find(j=>j.line==='bb' && j.status==='Actief');
  if(!active && HMI_SEL && !waiting.some(j=>j.id===HMI_SEL)) HMI_SEL=null;
  const sel = active || waiting.find(j=>j.id===HMI_SEL);
  const done = HMI_RUN ? HMI_RUN.bags.length : 0;
  return `<h1>HMI big bag installatie</h1><p class="sub">Simulatie van het bedienpaneel aan de machine. De machine operator heeft geen toegang tot het platform; hij selecteert en start hier alleen klaargezette opdrachten.</p>
  <div class="hmi">
    <div class="bar"><span>VULSTATION BIG BAG · HAL 7</span><span>Operator OP-017 · ${new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}</span></div>
    <div class="grid g2">
      <div class="panel"><h3>Klaargezette opdrachten (${waiting.length})</h3>
        ${waiting.map(j=>`<div class="job ${HMI_SEL===j.id?'sel':''}" data-id="${j.id}"><b>${esc(j.order)}</b> · ${esc(j.customer)}<br>
          <span class="lbl">${j.qty} × ${j.weight} kg ± ${j.tol} · ${esc(j.silo)} · lot ${esc(j.lot)}</span></div>`).join('') || '<div class="lbl">Geen opdrachten. Verstuur er een vanuit het platform (rol Site operator).</div>'}
      </div>
      <div class="panel"><h3>${active?'Actieve opdracht':'Geselecteerde opdracht'}</h3>
        ${sel?`<div class="lbl">Order</div><div style="font-size:18px;font-weight:bold;color:#fff">${esc(sel.order)} · ${esc(sel.customer)}</div>
          <div class="grid g2" style="margin-top:10px"><div><div class="lbl">Big bag</div><div class="big">${done} / ${sel.qty}</div></div>
          <div><div class="lbl">Laatste gewicht</div><div class="big">${HMI_RUN&&HMI_RUN.bags.length?HMI_RUN.bags[HMI_RUN.bags.length-1].w:'—'} <span style="font-size:14px">kg</span></div></div></div>
          <div class="prog"><div style="width:${Math.round(done/sel.qty*100)}%"></div></div>
          <div class="lbl" style="margin-top:10px">Silo: ${esc(sel.silo)} · doel ${sel.weight} kg ± ${sel.tol}</div>
          <div class="lbl">Sticker: ${sel.sticker.filter(Boolean).map(esc).join(' / ')}</div>`
          :'<div class="lbl">Selecteer links een opdracht.</div>'}
      </div>
    </div>
    <div class="row">
      <button class="hbtn start" id="hStart" ${sel&&!active?'':'disabled'}>▶ START</button>
      <button class="hbtn stop" id="hStop" ${active?'':'disabled'}>■ STOP</button>
      <span class="lbl right">Demo: één big bag duurt hier 1 seconde in plaats van circa 7 minuten.</span>
    </div>
    ${HMI_RUN&&HMI_RUN.bags.length?`<div class="panel" style="margin-top:12px"><h3>Gewogen big bags</h3><table><tr><th>Bag</th><th>Gewicht</th><th>Tolerantie</th></tr>
      ${HMI_RUN.bags.slice(-5).reverse().map(b=>`<tr><td>${b.no}</td><td>${b.w} kg</td><td>${b.ok?'OK':'BUITEN'}</td></tr>`).join('')}</table></div>`:''}
  </div>`;
}

let HMI_TIMER=null;
function hmiStart(){
  const j=DB.jobs.find(x=>x.id===HMI_SEL); if(!j) return;
  j.status='Actief'; j.started=now(); log('OP-017','Opdracht gestart op HMI',j.order);
  HMI_RUN={ job:j, bags:[], full:makeReport(j,'OP-017',now(),true) };
  render();
  HMI_TIMER=setInterval(()=>{
    const r=HMI_RUN; r.bags.push(r.full.bags[r.bags.length]);
    if(r.bags.length>=j.qty){ hmiFinish(true); return; }
    if(VIEW==='hmi') render();
  },1000);
}
function hmiFinish(complete){
  clearInterval(HMI_TIMER); const r=HMI_RUN; if(!r) return; const j=r.job;
  if(complete){ j.report=r.full; }
  else { const n=r.bags.length; j.report=makeReport(j,'OP-017',j.started,false,n); j.report.bags=r.bags.slice(); j.report.total=+r.bags.reduce((a,b)=>a+b.w,0).toFixed(1); }
  j.status='Gereed'; HMI_RUN=null; HMI_SEL=null;
  log('Machine','Rapport ontvangen',`${j.order}, ${j.report.bags.length} big bags, ${j.report.status}`);
  toast(`Opdracht ${j.order} ${complete?'afgerond':'gestopt'}. Rapport is naar het platform gestuurd.`);
  render();
}

// START
// =====================================================================
const roleSel=document.getElementById('roleSel');
roleSel.innerHTML=Object.entries(ROLES).map(([k,r])=>`<option value="${k}">${r.label}</option>`).join('');
roleSel.value=ROLE;
roleSel.onchange=()=>{ ROLE=roleSel.value; EDITREC=null; JOBFILTER='Alle'; resetSel(); VIEW = ROLE==='machine'?'hmi':'home'; render(); toast(`U bekijkt het platform nu als ${ROLES[ROLE].label}.`); };
document.getElementById('resetBtn').onclick=()=>{ clearInterval(HMI_TIMER); HMI_RUN=null; HMI_SEL=null; seed(); resetSel(); go(ROLE==='machine'?'hmi':'home'); toast('Demo-gegevens teruggezet.'); };
seed(); resetSel(); render();
</script>
